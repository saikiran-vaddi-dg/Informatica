<!--
  Fixed skeleton for Results/<DataflowName>_run<runId>_analysis.html.

  Read this file once, then produce the final report by replacing every
  {{TOKEN}} below with real content — do not hand-write the CSS or page
  skeleton from scratch each time; that's wasted output on every single run.
  Only the placeholder content should differ run to run.

  Tokens:
    {{TITLE}}              - "<DataflowName> - Run <runId> Analysis"
    {{GENERATED_AT}}       - ISO 8601 timestamp
    {{STATUS_LABEL}}       - "Passed" or "Failed"
    {{STATUS_BADGE_CLASS}} - "badge-pass" or "badge-fail"
    {{SCOPE_HTML}}         - Scope section body (what was analyzed)
    {{SUMMARY_TEXT_HTML}}  - Summary section prose (pass/fail counts, overall health)
    {{SUMMARY_CHART_HTML}} - One or more `.bar-row` blocks, see example below
    {{FINDINGS_HTML}}      - One or more `.finding` blocks, see example below
    {{ACTIONS_HTML}}       - One or more `.action` blocks, see example below
    {{GAPS_HTML}}          - Gaps section body, or "<p>None.</p>"

  Bar chart row (compute the percentage yourself, don't invent a charting
  library):
    <div class="bar-row">
      <span class="bar-label">Only In B</span>
      <div class="bar-track"><div class="bar-fill" style="width: 10%"></div></div>
      <span class="bar-value">1 (10%)</span>
    </div>

  Finding block:
    <div class="finding">
      <h3>PROVIDER_RECIPNT_ID mismatch (2/9 rows)</h3>
      <p>Evidence-grounded description here, cite the file/row/value.</p>
    </div>

  Recommended action block — classification determines the badge class:
    test-case defect      -> class="badge-testcase"
    environment/data defect -> class="badge-env"
    genuine workflow/ETL bug -> class="badge-bug"
    no action needed       -> class="badge-none"
    <div class="action">
      <span class="badge {{badge class from above}}">Environment/data defect</span>
      <p>What should change, stated plainly.</p>
    </div>
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a2e; --muted: #6b7280; --border: #e5e7eb;
    --pass: #16a34a; --fail: #dc2626;
    --testcase: #2563eb; --env: #d97706; --bug: #dc2626; --none: #6b7280;
    --track: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14141f; --fg: #e8e8f0; --muted: #9ca3af; --border: #2d2d3d; --track: #24243a; }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; margin: 0; padding: 2rem; max-width: 900px; margin-inline: auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
  h3 { font-size: 1rem; margin-bottom: 0.3rem; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
  .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-weight: 600; font-size: 0.85rem; color: #fff; }
  .badge-pass { background: var(--pass); }
  .badge-fail { background: var(--fail); }
  .bar-row { display: flex; align-items: center; gap: 0.75rem; margin: 0.4rem 0; }
  .bar-label { width: 160px; flex-shrink: 0; font-size: 0.85rem; color: var(--muted); }
  .bar-track { flex: 1; background: var(--track); border-radius: 4px; height: 14px; overflow: hidden; }
  .bar-fill { background: var(--fail); height: 100%; border-radius: 4px; }
  .bar-value { width: 90px; text-align: right; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .finding { border-left: 3px solid var(--border); padding: 0.5rem 0 0.5rem 1rem; margin: 1rem 0; }
  .action { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 0.75rem 0; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; color: #fff; margin-bottom: 0.5rem; }
  .badge-testcase { background: var(--testcase); }
  .badge-env { background: var(--env); }
  .badge-bug { background: var(--bug); }
  .badge-none { background: var(--none); }
  code { background: var(--track); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.9em; }
  table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
  <h1>{{TITLE}}</h1>
  <div class="meta">Generated {{GENERATED_AT}} &middot; <span class="status-badge {{STATUS_BADGE_CLASS}}">{{STATUS_LABEL}}</span></div>

  <h2>Scope</h2>
  {{SCOPE_HTML}}

  <h2>Summary</h2>
  {{SUMMARY_TEXT_HTML}}
  {{SUMMARY_CHART_HTML}}

  <h2>Findings</h2>
  {{FINDINGS_HTML}}

  <h2>Recommended Actions</h2>
  {{ACTIONS_HTML}}

  <h2>Gaps</h2>
  {{GAPS_HTML}}
</body>
</html>
